{% extends "base.html" %}
{% block title %}Login - CareerReady{% endblock %}
{% block body %}<div class="auth-page d-flex align-items-center justify-content-center"><div class="auth-card"><div class="text-center mb-4"><a href="{{ url_for('landing') }}" class="auth-brand"><i class="bi bi-compass me-1"></i>CareerReady</a><p class="text-muted small mt-2 mb-0">Log in to continue your career journey.</p></div><form method="POST"><div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ email or '' }}" placeholder="you@example.com" required></div><div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" placeholder="Enter your password" required></div><button type="submit" class="btn btn-cr-primary w-100 py-2">Login <i class="bi bi-arrow-right ms-1"></i></button></form><p class="text-center text-muted mt-4 mb-0 small">Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-semibold">Create one</a></p><div class="callout mt-4"><div class="small fw-semibold mb-1"><i class="bi bi-info-circle me-1"></i>Demo accounts</div><div class="small text-muted">Student: <code>student@demo.com / student123</code><br>Admin: <code>admin@demo.com / admin123</code></div></div></div></div>{% endblock %}
