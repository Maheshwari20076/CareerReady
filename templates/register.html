{% extends "base.html" %}
{% block title %}Register - CareerReady{% endblock %}
{% block body %}<div class="auth-page d-flex align-items-center justify-content-center py-4"><div class="auth-card"><div class="text-center mb-4"><a href="{{ url_for('landing') }}" class="auth-brand"><i class="bi bi-compass me-1"></i>CareerReady</a><p class="text-muted small mt-2 mb-0">Create your student account and start preparing.</p></div><form method="POST"><div class="mb-3"><label class="form-label">Full Name</label><input type="text" name="name" class="form-control" value="{{ name or '' }}" placeholder="Your full name" required></div><div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ email or '' }}" placeholder="you@example.com" required></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6"></div><div class="col-md-6 mb-3"><label class="form-label">Confirm Password</label><input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required minlength="6"></div></div><button type="submit" class="btn btn-cr-primary w-100 py-2">Create Account <i class="bi bi-arrow-right ms-1"></i></button></form><p class="text-center text-muted mt-4 mb-0 small">Already have an account? <a href="{{ url_for('auth.login') }}" class="fw-semibold">Login</a></p></div></div>{% endblock %}
