{% extends "base.html" %}
{% block body %}
<div class="app-shell">
  <aside class="sidebar" id="appSidebar">
    <div class="brand"><i class="bi bi-compass"></i> CareerReady</div>
    <div class="sidebar-section-label">Workspace</div>
    <nav>
      <a href="{{ url_for('student.dashboard') }}" class="sidebar-link {{ 'active' if active_page == 'dashboard' }}"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
      <a href="{{ url_for('student.profile') }}" class="sidebar-link {{ 'active' if active_page == 'profile' }}"><i class="bi bi-person"></i> My Profile</a>
      <a href="{{ url_for('student.careers') }}" class="sidebar-link {{ 'active' if active_page == 'careers' }}"><i class="bi bi-briefcase"></i> My Career</a>
      <a href="{{ url_for('student.skills') }}" class="sidebar-link {{ 'active' if active_page == 'skills' }}"><i class="bi bi-stars"></i> My Skills</a>
      <a href="{{ url_for('student.skill_gap') }}" class="sidebar-link {{ 'active' if active_page == 'skill_gap' }}"><i class="bi bi-bar-chart-line"></i> Skill Gap</a>
      <a href="{{ url_for('resources.resources') }}" class="sidebar-link {{ 'active' if active_page == 'resources' }}"><i class="bi bi-book"></i> Learning Resources</a>
      <a href="{{ url_for('interview.interview') }}" class="sidebar-link {{ 'active' if active_page == 'interview' }}"><i class="bi bi-chat-square-text"></i> Interview Practice</a>
      <a href="{{ url_for('student.progress') }}" class="sidebar-link {{ 'active' if active_page == 'progress' }}"><i class="bi bi-graph-up-arrow"></i> My Progress</a>
    </nav>
    <div class="sidebar-footer">
      <a href="{{ url_for('auth.logout') }}" class="sidebar-link"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>
  </aside>
  <main class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-light border d-md-none" id="sidebarToggle" aria-label="Open menu"><i class="bi bi-list"></i></button>
        <div>
          <h4 class="topbar-title">{{ page_title }}</h4>
        </div>
      </div>
      <div class="topbar-user"><span class="avatar">{{ current_user.name[:1]|upper }}</span><span class="d-none d-sm-inline">{{ current_user.name }}</span></div>
    </div>
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
