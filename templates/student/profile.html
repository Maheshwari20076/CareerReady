{% extends "student/_layout.html" %}
{% set active_page = 'profile' %}
{% set page_title = 'My Profile' %}
{% block content %}
<div class="page-intro"><h4>Your profile</h4><p>Keep your student details up to date.</p></div>
<div class="row g-4"><div class="col-lg-8"><div class="card p-4"><div class="d-flex align-items-center gap-3 mb-4"><div class="avatar" style="width:52px;height:52px;font-size:1.1rem;">{{ current_user.name[:1]|upper }}</div><div><h5 class="fw-bold mb-1">{{ current_user.name }}</h5><div class="small text-muted">{{ current_user.email }}</div></div></div><form method="POST"><div class="mb-3"><label class="form-label">Full Name</label><input type="text" name="name" class="form-control" value="{{ current_user.name }}" required></div><div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" value="{{ current_user.email }}" disabled></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Phone</label><input type="text" name="phone" class="form-control" value="{{ profile.phone or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Graduation Year</label><input type="number" name="graduation_year" class="form-control" value="{{ profile.graduation_year or '' }}"></div></div><div class="mb-3"><label class="form-label">College</label><input type="text" name="college" class="form-control" value="{{ profile.college or '' }}"></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Degree</label><input type="text" name="degree" class="form-control" value="{{ profile.degree or '' }}"></div><div class="col-md-6 mb-3"><label class="form-label">Location</label><input type="text" name="location" class="form-control" value="{{ profile.location or '' }}"></div></div><div class="mb-3"><label class="form-label">Bio</label><textarea name="bio" class="form-control" rows="4" placeholder="Tell us a little about yourself...">{{ profile.bio or '' }}</textarea></div><button type="submit" class="btn btn-cr-primary">Save Profile <i class="bi bi-check2 ms-1"></i></button></form></div></div></div>
{% endblock %}
