{% extends "base.html" %}
{% block body %}
<div class="app-shell">
  <aside class="sidebar" id="appSidebar">
    <div class="brand"><i class="bi bi-compass"></i> CareerReady <span class="badge bg-light text-dark ms-1" style="font-size:.62rem;">ADMIN</span></div>
    <div class="sidebar-section-label">Management</div>
    <nav>
      <a href="{{ url_for('admin.dashboard') }}" class="sidebar-link {{ 'active' if active_page == 'dashboard' }}"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
      <a href="{{ url_for('admin.students') }}" class="sidebar-link {{ 'active' if active_page == 'students' }}"><i class="bi bi-people"></i> Students</a>
      <a href="{{ url_for('admin.careers') }}" class="sidebar-link {{ 'active' if active_page == 'careers' }}"><i class="bi bi-briefcase"></i> Careers</a>
      <a href="{{ url_for('admin.skills') }}" class="sidebar-link {{ 'active' if active_page == 'skills' }}"><i class="bi bi-stars"></i> Skills</a>
      <a href="{{ url_for('admin.career_skills') }}" class="sidebar-link {{ 'active' if active_page == 'career_skills' }}"><i class="bi bi-diagram-3"></i> Career Skills</a>
      <a href="{{ url_for('admin.resources') }}" class="sidebar-link {{ 'active' if active_page == 'resources' }}"><i class="bi bi-book"></i> Learning Resources</a>
      <a href="{{ url_for('admin.interview_questions') }}" class="sidebar-link {{ 'active' if active_page == 'interview_questions' }}"><i class="bi bi-chat-square-text"></i> Interview Questions</a>
    </nav>
    <div class="sidebar-footer"><a href="{{ url_for('auth.logout') }}" class="sidebar-link"><i class="bi bi-box-arrow-right"></i> Logout</a></div>
  </aside>
  <main class="main-content"><div class="topbar"><div class="d-flex align-items-center gap-2"><button class="btn btn-light border d-md-none" id="sidebarToggle" aria-label="Open menu"><i class="bi bi-list"></i></button><h4 class="topbar-title">{{ page_title }}</h4></div><div class="topbar-user"><span class="avatar">{{ current_user.name[:1]|upper }}</span><span class="d-none d-sm-inline">{{ current_user.name }}</span></div></div>{% block content %}{% endblock %}</main>
</div>
{% endblock %}
